mechanical_judgment:
  body:
    # =====================================================================
    # 測尺 機械的判断ルール
    # =====================================================================
    # 体重・管囲・体高の 3指標を性別ごとの [min, max] 範囲で判定する。
    # 範囲外となった指標の数でグレードを決定:
    #   ◎  : 3指標すべて範囲内
    #   ◯  : 1指標のみ範囲外
    #   ▲  : 2指標が範囲外
    #   ×  : 3指標すべて範囲外
    # 体高は height_max が設定されていれば上下限チェック、なければ下限のみ。
    male:
      weight_min: 420   # 馬体重 下限 (kg)
      weight_max: 508   # 馬体重 上限 (kg)
      height_min: 152   # 体高   下限 (cm)
      height_max: 160   # 体高   上限 (cm)
      cannon_min: 19.5  # 管囲   下限 (cm)
      cannon_max: 21.5  # 管囲   上限 (cm)
    female:
      weight_min: 410
      weight_max: 480
      height_min: 150
      height_max: 160
      cannon_min: 19.2
      cannon_max: 21.5

  dam:
    # =====================================================================
    # 母馬 機械的判断ルール（母馬年齢 × 産駒の競走成績）
    # =====================================================================
    # 馬が生まれた年における母馬の年齢（dam_age = 馬出生年 − 母出生年）で分岐し、
    # その年齢帯に応じた産駒成績の基準でグレードを決定する。
    #
    # 【判定ツリー】
    #   dam_age < age_unconditional_min (6)
    #       → ×  産駒が少なすぎて実績評価が困難
    #
    #   age_unconditional_min (6) ≤ dam_age ≤ age_unconditional_max (9)
    #       → ◎  繁殖黄金期：産駒成績によらず無条件OK
    #
    #   dam_age = age_graded_placed_max (10)
    #       産駒に重賞2着以上あり   → ◎
    #       産駒にオープン勝ちあり  → ◯
    #       それ以外                → ▲
    #
    #   (age_graded_placed_max + 1) ≤ dam_age ≤ age_graded_win_max  [11-14歳]
    #       産駒に重賞勝ちあり      → ◎
    #       産駒に重賞2着以上あり   → ▲  ※勝ちなしは年齢リスクを相殺できない
    #       産駒にオープン勝ちあり  → ▲
    #       それ以外                → ×
    #
    #   dam_age ≥ age_ng_min (15)
    #       産駒に重賞勝ちあり      → ★  高齢だが実績あり（基本は見送り推奨）
    #       それ以外                → ×
    #
    age_unconditional_min: 6      # この年齢未満は × （産駒少なすぎ）
    age_unconditional_max: 9      # この年齢以下は ◎ 確定（繁殖黄金期）
    age_graded_placed_max: 10     # この年齢は重賞2着以上で ◎、オープン勝ちで ◯
    age_graded_win_max: 14        # この年齢以下（かつ11歳以上）は重賞勝ちのみで ◎
    age_ng_min: 15                # この年齢以上は基本 ×（重賞勝ち産駒がいれば ★）

  trainer:
    # =====================================================================
    # 調教師 機械的判断ルール
    # =====================================================================
    # trainer_yearly_stats の直近 recent_years 年（完了年度のみ）を集計し、
    # 平均勝利数・リーディング順位・重賞勝利数でグレードを決定する。
    # ※ 重賞勝利数は RACE DataSpec（2024年以降のみ取得）からの集計のため、
    #   歴史的な重賞実績が少なく見える場合がある。
    #
    # 【キャリア判定】開業年数で評価可否を先に決める
    #   開業 5年未満
    #       → 判定不可  サンプルが少なすぎる（重賞実績があっても同様）
    #
    #   開業 min_career_years (6) 年未満 かつ 重賞勝利なし
    #       → 判定不可  開業5年目で重賞を勝っていなければ評価不十分
    #       ※ 開業5年目でも重賞勝ちが 1件以上あれば以下のグレード判定へ進む
    #
    #   上記以外 → 以下のグレード判定へ
    #
    # 【グレード判定】
    #   ◎ : 直近3年でリーディング上位10位以内に top10_for_good (1) 回以上
    #       かつ 5年平均勝利数 ≥ avg_wins_good (37)
    #   ◯ : 5年平均勝利数 ≥ avg_wins_ok (15)
    #       かつ 重賞勝利 ≥ graded_wins_for_ok (1) 件（DB 2024年以降分）
    #   ▲ : 5年平均勝利数 ≥ avg_wins_try (8)（◯の条件未達）
    #   × : 重賞勝利なし かつ 5年平均勝利数 < avg_wins_try (8)
    #   △ : 上記以外（重賞実績あるが平均勝利数が低い稀なケース）
    #
    recent_years: 5               # 集計対象の直近N年（完了年度のみ、今年は除外）
    top10_for_good: 1             # ◎条件: 直近3年でリーディング上位10位に入った回数
    avg_wins_good: 37             # ◎条件: 5年平均勝利数の下限
    avg_wins_ok: 15               # ◯条件: 5年平均勝利数の下限
    avg_wins_try: 8               # ▲条件: 5年平均勝利数の下限
    graded_wins_for_ok: 1         # ◯条件: 重賞勝利数の下限（DB 2024年以降分）
    min_career_years: 6           # 開業5年目かつ重賞0勝を判定不可とする境界（ハードコードの5年と組み合わせ）

clubs:
  carrot:
    name: キャロットクラブ
    priority_quota: 200       # 優先枠口数（母馬優先+最優先）
    total_quota: 400          # 総募集口数
    member_growth_rate: 0.01  # 会員増加率（年次補正用）

